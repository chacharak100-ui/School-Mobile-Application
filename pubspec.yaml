name: school_mobile_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.3.3
  path: ^1.9.0
  crypto: ^3.0.3
  http: ^1.2.0
  font_awesome_flutter: ^10.7.0
  flutter_secure_storage: ^9.2.4
  local_auth: ^2.3.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  animate_do: ^3.3.4
  mobile_scanner: ^5.2.3
  intl: ^0.19.0
  qr_flutter: ^4.1.0      # For generating QR codes
  screenshot: ^3.0.0      # To capture the widget as an image
  geolocator: ^13.0.1
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  cached_network_image: ^3.4.1
  flutter_local_notifications: ^17.2.4
  gal: ^2.3.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/background.png
    - assets/images/light-1.png
    - assets/images/light-2.png
    - assets/images/clock.png